name: Deploy WMS to VPS

on:
  push:
    branches:
      - main
      - golang-migration

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        if: steps.filter.outputs.frontend == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend to Firebase Hosting
        if: steps.filter.outputs.frontend == 'true'
        working-directory: ./frontend
        env:
          FIREBASE_SA_PROD: ${{ secrets.FIREBASE_TOKEN_PROD }}
          FIREBASE_SA_DEV: ${{ secrets.FIREBASE_TOKEN_DEV }}
        run: |
          npm install -g firebase-tools
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "$FIREBASE_SA_PROD" > firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-sa.json"
            firebase deploy --only hosting --project wmskelja
          else
            echo "$FIREBASE_SA_DEV" > firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-sa.json"
            firebase deploy --only hosting --project dev-wmskelja
          fi

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Backend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Setup Go
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        if: steps.filter.outputs.backend == 'true'
        working-directory: ./backend
        run: go test ./internal/...

      - name: Build Backend Binaries (Linux)
        if: steps.filter.outputs.backend == 'true'
        working-directory: ./backend
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o worker ./cmd/worker

      - name: Deploy Backend Binaries to VPS via SCP
        if: steps.filter.outputs.backend == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.VPS_IP || secrets.DEV_VPS_IP }}
          username: ${{ github.ref == 'refs/heads/main' && secrets.VPS_USERNAME || secrets.DEV_VPS_USERNAME }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
          source: "backend/api,backend/worker"
          target: ${{ github.ref == 'refs/heads/main' && 'wms-service-prod' || 'wms-service-dev' }}
          strip_components: 1

      - name: Deploy Config Files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.VPS_IP || secrets.DEV_VPS_IP }}
          username: ${{ github.ref == 'refs/heads/main' && secrets.VPS_USERNAME || secrets.DEV_VPS_USERNAME }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ github.ref == 'refs/heads/main' && 'wms-service-prod' || 'wms-service-dev' }}

      - name: Restart Backend Services via SSH
        if: steps.filter.outputs.backend == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.VPS_IP || secrets.DEV_VPS_IP }}
          username: ${{ github.ref == 'refs/heads/main' && secrets.VPS_USERNAME || secrets.DEV_VPS_USERNAME }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              cd wms-service-prod
              if [ -n "${{ secrets.WMS_ENV_PROD }}" ]; then
                echo "${{ secrets.WMS_ENV_PROD }}" > .env
              fi
            else
              cd wms-service-dev
              if [ -n "${{ secrets.WMS_ENV_DEV }}" ]; then
                echo "${{ secrets.WMS_ENV_DEV }}" > .env
              fi
            fi

            # Pastikan binary bisa dieksekusi
            chmod +x api worker

            # Gunakan Docker Compose V2 (standar baru), jika gagal fallback ke V1
            docker compose up -d --remove-orphans || docker-compose up -d --remove-orphans
