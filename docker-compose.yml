services:
  # Backend Go API
  backend-api:
    image: alpine:latest
    container_name: wms-service-${ENV:-dev}-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT_HOST:-3005}:${PORT:-3000}"
    working_dir: /app
    command: ["./api"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      - DB_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST:-10.10.0.9}:${MYSQL_PORT:-3306})/${MYSQL_DATABASE}?parseTime=true
      - FIREBASE_CREDENTIALS_PATH=/app/firebase/${FIREBASE_JSON_FILENAME}
      - RABBITMQ_URL=${RABBITMQ_CONNECTION}://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-10.10.0.7}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST}
      - RABBITMQ_EXCHANGE_NAME=${RABBITMQ_EXCHANGE_NAME}
      - RABBITMQ_EXCHANGE_TYPE=${RABBITMQ_EXCHANGE_TYPE}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT}
      - RABBITMQ_PREFETCH_SIZE=${RABBITMQ_PREFETCH_SIZE}
    volumes:
      - ./api:/app/api
      - ./firebase:/app/firebase
    networks:
      intra:
        ipv4_address: ${API_IPV4:-10.10.0.10}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 512M

  # Backend Go Worker (Background CLI/Daemon)
  backend-worker:
    image: alpine:latest
    container_name: wms-service-${ENV:-dev}-worker
    restart: unless-stopped
    working_dir: /app
    command: ["./worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      - DB_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST:-10.10.0.9}:${MYSQL_PORT:-3306})/${MYSQL_DATABASE}?parseTime=true
      - FIREBASE_CREDENTIALS_PATH=/app/firebase/${FIREBASE_JSON_FILENAME}
      - RABBITMQ_URL=${RABBITMQ_CONNECTION}://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-10.10.0.7}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST}
      - RABBITMQ_EXCHANGE_NAME=${RABBITMQ_EXCHANGE_NAME}
      - RABBITMQ_EXCHANGE_TYPE=${RABBITMQ_EXCHANGE_TYPE}
      - RABBITMQ_PREFETCH_COUNT=${RABBITMQ_PREFETCH_COUNT}
      - RABBITMQ_PREFETCH_SIZE=${RABBITMQ_PREFETCH_SIZE}
      - GOMEMLIMIT=${GOMEMLIMIT}
      - GOGC=${GOGC}
    volumes:
      - ./worker:/app/worker
      - ./firebase:/app/firebase
    networks:
      intra:
        ipv4_address: ${WORKER_IPV4:-10.10.0.11}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 512M

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: wms-mysql-${ENV:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT_HOST:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wms}
      MYSQL_USER: ${MYSQL_USER:-wms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      intra:
        ipv4_address: ${MYSQL_IPV4:-10.10.0.9}

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: wms-rabbitmq-${ENV:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT_HOST:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT_HOST:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks:
      intra:
        ipv4_address: ${RABBITMQ_IPV4:-10.10.0.7}

  # Nginx Proxy Manager
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: wms-npm-${ENV:-dev}
    restart: unless-stopped
    ports:
      - "${NPM_PORT_HTTP:-80}:80"
      - "${NPM_PORT_HTTPS:-443}:443"
      - "127.0.0.1:${NPM_PORT_ADMIN:-81}:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      intra:
        ipv4_address: ${NPM_IPV4:-10.10.0.8}

networks:
  intra:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.10.0.0/24}

volumes:
  mysql_data:
  rabbit_data:
  npm_data:
  npm_letsencrypt:
